[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bankfile"
version = "0.2.0"
description = "One normalised schema for MT940 and OFX/QFX bank files, with a corpus of real bank deviations."
readme = "README.md"
# MIT alone, and only this project's own notice. The borrowed bank fixtures live under
# tests/fixtures/ and are excluded from every artifact, which the `package` CI job enforces by
# failing the build if one rides the sdist. So nothing here distributes another project's BSD,
# MIT or Apache material, and "MIT AND BSD-3-Clause" was telling PyPI otherwise: a downstream
# licence scanner then chases attribution obligations for material the wheel does not contain.
# The upstream notices stay in the repository, in a LICENSE file beside the data they cover.
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Dylan Merigaud" }]
# No camt053, bai2 or iso20022 here until the library reads them. A keyword is a promise made
# to someone searching PyPI, and the one thing a finance library cannot afford is to overclaim.
keywords = ["mt940", "ofx", "qfx", "bank", "statement", "reconciliation", "fintech"]
# Classifiers are how PyPI is filtered, so a missing one costs the readers who search by
# audience or by supported version rather than by name. Two deliberate absences:
#   no "License ::" entry, because PEP 639 replaced it with License-Expression above and PyPI
#     rejects a distribution that carries both.
#   no 3.14, because it sits OUTSIDE the range CI covers. The matrix runs 3.10, 3.12 and 3.13,
#     so 3.11 is interpolation between two tested points and 3.14 would be extrapolation past
#     the last one. requires-python permits 3.14 all the same; a classifier is read as a claim
#     that a version was tried, and that one has not been.
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Accounting",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  # The floor is 5.0 and it was MEASURED, not guessed: the adapter reads mt940.tags.StatementGLS,
  # which does not exist before 5.0.0. Declared as >=4.30 first, which imported fine on its own
  # and made `import bankfile` fail with AttributeError on every 4.x. A dependency floor nobody
  # installs is a floor nobody tests.
  # wolph/mt940, BSD licensed and maintained. NOT rewritten, on purpose: it already structures
  # the :86: field, including reassembling a purpose across ?2x subfields AND across physical
  # line breaks. That was verified by running it on a real German file, after reading its regex
  # and concluding the opposite. Reading code and inferring behaviour is the mistake this
  # project keeps paying for. Its floor is Python 3.10, same as ours.
  "mt-940>=5.0",
]

[project.urls]
# The four links PyPI renders in its sidebar. Source and Changelog are not decoration for a
# parser: someone who suspects a wrong amount arrives on the PyPI page first, and what they
# need from there is the code that produced the figure and the list of changes that moved one.
Homepage = "https://github.com/DylanMerigaud/bankfile"
Source = "https://github.com/DylanMerigaud/bankfile"
Issues = "https://github.com/DylanMerigaud/bankfile/issues"
Changelog = "https://github.com/DylanMerigaud/bankfile/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# The MCP server is optional on purpose. Someone importing this library inside their own
# pipeline has no reason to pull a server framework, and the core must stay installable in the
# old stacks a bank format parser lives in.
# pydantic is declared even though `mcp` already pulls it in. The server imports it directly,
# so relying on somebody else's transitive dependency means the day mcp drops or swaps it, this
# package breaks for a reason nothing here explains.
mcp = ["mcp>=2.0", "pydantic>=2"]

[project.scripts]
bankfile = "bankfile.cli:main"
bankfile-mcp = "bankfile.mcp:main"

[dependency-groups]
# mcp is in the dev group as well so that ruff and mypy actually check the server.
dev = ["pytest>=8", "pytest-cov>=5", "mypy>=1.11", "ruff>=0.6", "mcp>=2.0"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

# STRICT BY DEFAULT, and every exemption carries its written reason. It is the rule of the kit
# (eslint.config.mts): an exemption without a justification is a rule you switch off because it
# bothers you, not because it is wrong.
[tool.ruff.lint]
select = [
  "E", "W",      # pycodestyle
  "F",           # pyflakes
  "I",           # import order
  "N",           # pep8-naming
  "UP",          # pyupgrade
  "B",           # bugbear
  "A",           # shadowing of builtins
  "C4",          # comprehensions
  "DTZ",         # naive datetimes: a bank statement carries dates, never ambiguity
  "T20",         # no print in a library
  "SIM", "RET", "ARG", "PTH", "ERA", "PL", "RUF", "TRY", "PERF", "S",
]
ignore = [
  # The body of a parser IS a sequence of branches over real bank cases. Capping complexity
  # here would push us to split into one-line functions whose only role would be to satisfy
  # the counter, which makes the bank case HARDER to read, not easier.
  "PLR0912", "PLR0911",
  # Tag codes and field widths ARE constants of the format. Naming them would produce a
  # 200-entry dictionary that says the same thing as the spec twice.
  "PLR2004",
]

[tool.ruff.lint.per-file-ignores]
# The tests assert on literal values taken from real files: that is the point.
"tests/**" = ["S101", "PLR2004"]
# The CLI and the verification scripts write to standard output, that is their function.
# A SCOPE exemption, not a comfort one: it names two paths, it does not switch off the rule.
"src/bankfile/cli.py" = ["T20"]
# The MCP server has a console entry point too, and its argument parsing reports to stderr
# before any transport exists to report through. Same reason as the CLI, same narrow scope.
#
# PLR0913: list_transactions takes nine parameters and that is the design. An MCP tool's
# parameters ARE its schema, which is the only thing a model sees; folding the filters into a
# nested object would hide them from the model and make the tool harder to call, not easier.
"src/bankfile/mcp/server.py" = ["T20", "PLR0913"]
# The launcher defers its import ON PURPOSE, and that deferral IS the feature: it is what lets
# `bankfile-mcp` answer with an instruction instead of a traceback when the optional dependency
# is missing. The answer goes to stderr because at that point no transport exists to answer on.
"src/bankfile/mcp/__init__.py" = ["T20", "PLC0415"]
"scripts/**" = ["T20"]
# measure_parsers.py imports ofxparse and ofxtools INSIDE its functions on purpose. Neither is
# a dependency of this package, and neither should ever become one: nothing here may pull in an
# abandoned parser, and CI must not depend on it. A top-level import would make the file
# unloadable everywhere except the throwaway environment it is meant to be run in.
"scripts/measure_parsers.py" = ["T20", "PLC0415"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["src", "tests"]

[tool.pytest.ini_options]
# 95 and not 85. The gate sat twelve points below the actual figure, which means roughly 140
# tests could have been deleted with CI still green: a gate nothing can trip is decoration.
addopts = "-q --cov=bankfile --cov-report=term-missing --cov-fail-under=95"
testpaths = ["tests"]

[tool.hatch.build.targets.sdist]
# The borrowed bank fixtures stay out of the published artifact. They are test inputs, they are
# not ours, and an audit found a named person's real statement among them: the fewer places
# that data can travel to, the better. Anyone who wants to run the suite clones the repository.
exclude = ["tests/fixtures/**"]
