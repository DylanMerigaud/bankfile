name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The base of the distributions still supported. A bank format parser lives inside
        # old stacks: breaking 3.10 for recent syntax would cost more adoption than the
        # syntax gains.
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --all-groups
      - run: uv run --python ${{ matrix.python }} pytest

  floor:
    # The declared dependency floor is a claim, and an untested claim is a wrong one. This job
    # installs it EXACTLY. It exists because `mt-940>=4.30` was declared without being tried:
    # the package imported fine on its own and `import bankfile` raised AttributeError on every
    # 4.x, so the metadata promised an installation that could not work.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --all-groups
      - run: uv pip install "mt-940==5.0.0"
      - run: uv run --no-sync pytest

  package:
    # Build the distribution and install it, every time. Packaging defects are invisible to a
    # test suite run from the source tree: the wheel once claimed "Typing :: Typed" while
    # shipping no py.typed, so every consumer's type checker saw Any where the API returns
    # Decimal, and nothing here would have noticed until somebody complained.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - name: the wheel must ship its type marker
        run: unzip -l dist/*.whl | grep -q 'bankfile/py.typed'
      - name: no borrowed fixture may ride the sdist
        run: |
          if tar tzf dist/*.tar.gz | grep -E 'tests/fixtures/.*\.(sta|txt|ofx|qfx)$'; then
            echo "a borrowed bank fixture is inside the sdist" >&2
            exit 1
          fi
      - name: the installed console scripts must work
        run: |
          uv venv /tmp/fresh
          VIRTUAL_ENV=/tmp/fresh uv pip install "$(ls dist/*.whl)[mcp]"
          /tmp/fresh/bin/bankfile tests/fixtures/paired/account-a.sta --json > /dev/null
          /tmp/fresh/bin/bankfile-mcp --help > /dev/null

  corpus:
    # The corpus is the ASSET of the project, not the code: code can be regenerated, the real
    # deviations of banks cannot be invented. So it is validated just like the tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 scripts/validate_corpus.py
      # A fixture is worth something because its diff against the shared template IS the
      # deviation. Edited by hand it drifts, the diff stops saying anything, and the note
      # beside it starts describing a file that no longer exists.
      - run: python3 scripts/build_fixtures.py --check
